<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Special Question for You ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
      width: 100%;
      max-width: 440px;
      text-align: center;
      position: relative;
    }

    /* Step Fade Animations */
    .step {
      display: none;
      opacity: 0;
      transition: opacity 0.4s ease-in-out;
    }

    .step.active {
      display: block;
      opacity: 1;
    }

    .question-title {
      font-size: 24px;
      font-weight: bold;
      color: #333;
      margin-bottom: 25px;
      line-height: 1.3;
    }

    /* Input & Textarea */
    input[type="text"], textarea {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #ffd1d7;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 20px;
    }

    textarea {
      resize: none;
      height: 90px;
      font-family: inherit;
    }

    input:focus, textarea:focus {
      border-color: #ff4757;
    }

    /* Slider Customization */
    .slider-container {
      margin: 20px 0 30px;
    }

    .range-slider {
      width: 100%;
      accent-color: #ff4757;
      cursor: pointer;
    }

    .slider-val {
      font-size: 28px;
      font-weight: bold;
      color: #ff4757;
      margin-top: 10px;
    }

    /* Choice Options Grid */
    .choice-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 25px;
    }

    .choice-btn {
      padding: 12px;
      background: #fff5f6;
      border: 2px solid #ffd1d7;
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      color: #444;
      transition: all 0.2s;
    }

    .choice-btn:hover, .choice-btn.selected {
      background: #ff4757;
      color: white;
      border-color: #ff4757;
    }

    /* Action Buttons Area */
    .btn-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 30px;
      min-height: 60px;
      position: relative;
    }

    .btn {
      padding: 12px 35px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-next, .btn-yes {
      background-color: #ff4757;
      color: white;
      box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
    }

    .btn-next:hover, .btn-yes:hover {
      transform: scale(1.05);
    }

    .btn-no {
      background-color: #747d8c;
      color: white;
      transition: all 0.15s ease-out;
      z-index: 10;
    }

    /* Confetti */
    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      top: -10px;
      will-change: transform;
      animation: fall 3s linear infinite;
    }

    @keyframes fall {
      to { transform: translateY(100vh) rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="card">
    
    <div class="step active" id="step1">
      <div class="question-title">What's your name? ✨</div>
      <input type="text" id="userName" placeholder="Enter your name..." autocomplete="off">
      <button class="btn btn-next" onclick="goToStep(2)">Next ❤️</button>
    </div>

    <div class="step" id="step2">
      <div class="question-title">What's our ideal vibe together? 🍕🍿</div>
      <div class="choice-grid">
        <button class="choice-btn" onclick="selectChoice(this)">Late Night Drive 🚗</button>
        <button class="choice-btn" onclick="selectChoice(this)">Movie & Pizza 🍕</button>
        <button class="choice-btn" onclick="selectChoice(this)">Sunset Walk 🌅</button>
        <button class="choice-btn" onclick="selectChoice(this)">Coffee Date ☕</button>
      </div>
      <button class="btn btn-next" onclick="goToStep(3)">Next 💌</button>
    </div>

    <div class="step" id="step3">
      <div class="question-title">What do you like most about me? 💭</div>
      <textarea id="userLike" placeholder="Tell me something sweet..."></textarea>
      <button class="btn btn-next" onclick="goToStep(4)">Next 🔒</button>
    </div>

    <div class="step" id="step4">
      <div class="question-title" id="loveQuestion">Do you love me? ❤️</div>
      <div class="btn-group">
        <button class="btn btn-yes" onclick="goToStep(5)">Yes</button>
        <button class="btn btn-no" id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No</button>
      </div>
    </div>

    <div class="step" id="step5">
      <div class="question-title">How much do you love me? 🥺❤️</div>
      <div class="slider-container">
        <input type="range" min="1" max="100" value="100" class="range-slider" id="loveSlider" oninput="updateSlider(this.value)">
        <div class="slider-val" id="sliderVal">100%</div>
      </div>
      <button class="btn btn-next" onclick="finishForm()">Submit 🥰</button>
    </div>

    <div class="step" id="step6">
      <div class="question-title" style="color: #ff4757;">🎉 Yay! You made my day!</div>
      <div id="finalSummary" style="font-size: 15px; color: #555; text-align: left; line-height: 1.6; background: #fff5f6; padding: 15px; border-radius: 12px; margin-top: 15px;"></div>
    </div>

  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    let userName = "Sweetheart";
    let selectedVibe = "Not chosen";

    function updateSlider(val) {
      document.getElementById('sliderVal').textContent = `${val}%`;
    }

    function selectChoice(btn) {
      document.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedVibe = btn.textContent;
    }

    function goToStep(stepNumber) {
      if (stepNumber === 2) {
        const input = document.getElementById('userName').value.trim();
        if (input !== "") userName = input;
      }

      if (stepNumber === 4) {
        document.getElementById('loveQuestion').textContent = `So... do you love me, ${userName}? ❤️`;
      }

      document.querySelectorAll('.step').forEach(step => step.classList.remove('active'));

      setTimeout(() => {
        document.getElementById(`step${stepNumber}`).classList.add('active');
      }, 150);
    }

    function moveButton() {
      const maxX = window.innerWidth - noBtn.offsetWidth - 20;
      const maxY = window.innerHeight - noBtn.offsetHeight - 20;

      const randomX = Math.floor(Math.random() * maxX);
      const randomY = Math.floor(Math.random() * maxY);

      noBtn.style.position = 'fixed';
      noBtn.style.left = `${randomX}px`;
      noBtn.style.top = `${randomY}px`;
    }

    function finishForm() {
      const lovePercent = document.getElementById('loveSlider').value;
      const userLike = document.getElementById('userLike').value.trim();
      const finalSummary = document.getElementById('finalSummary');

      let summaryHTML = `<b>Name:</b> ${userName}<br>`;
      summaryHTML += `<b>Ideal Vibe:</b> ${selectedVibe}<br>`;
      if (userLike !== "") {
        summaryHTML += `<b>What you like:</b> "${userLike}"<br>`;
      }
      summaryHTML += `<b>Do you love me?</b> YES! ❤️<br>`;
      summaryHTML += `<b>Love Level:</b> ${lovePercent}% 🔥`;

      finalSummary.innerHTML = summaryHTML;
      goToStep(6);
      createConfetti();
    }

    function createConfetti() {
      const colors = ['#ff4757', '#ff6b81', '#ffa502', '#70a1ff', '#eccc68'];
      for (let i = 0; i < 60; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.animationDuration = (Math.random() * 2 + 1) + 's';
        confetti.style.opacity = Math.random();
        document.body.appendChild(confetti);
      }
    }
  </script>
</body>
</html>
